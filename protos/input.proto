syntax = "proto3";

package protocol;

import "common.proto";

// One sample of a gamepad, in the W3C "standard" mapping.
message GamepadInput {
  float left_x  = 1; // axes[0], -1 left, +1 right
  float left_y  = 2; // axes[1], -1 up,   +1 down
  float right_x = 3; // axes[2]
  float right_y = 4; // axes[3]

  // buttons[6]/[7].value, range 0.0..1.0
  float left_trigger  = 5;
  float right_trigger = 6;

  // buttons[N].pressed as bit N:
  //   0  A     4  LB    8  Back/View    12 D-pad up     16 Guide
  //   1  B     5  RB    9  Start/Menu   13 D-pad down
  //   2  X     6  LT    10 L3           14 D-pad left
  //   3  Y     7  RT    11 R3           15 D-pad right
  uint32 buttons = 7;

  // False if the browser does not recognize the standard mapping.
  bool standard_mapping = 8;
}

// One operator input sample.
message InputReport {
  // Per-session sequence number.
  uint64    sequence  = 1;
  Timestamp timestamp = 2;

  oneof input {
    GamepadInput gamepad = 3;
  }
}
