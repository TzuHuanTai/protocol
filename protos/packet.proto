syntax = "proto3";

package protocol;

import "camera_control.proto";

// ── Requests ────────────────────────────────────────────────────────────────

message DisconnectRequest {
  enum DisconnectReason {
    UNKNOWN          = 0;
    CLIENT_INITIATED = 1;
  }
  DisconnectReason reason = 1;
}

// Sends camera control commands, e.g., "exposure", "gain", etc.
message ControlCameraRequest {
  CameraControlId id    = 1;
  uint32          value = 2;
}

message TakeSnapshotRequest {
  uint32 quality = 1; // jpeg quality (0-100)
}

// QueryFileType defines the way of file query
enum QueryFileType  {
  LATEST_FILE = 0; // Request the latest file
  BEFORE_FILE = 1; // Request older files with the specified file name as parameter, e.g., "20260719_103000.mp4"
  BEFORE_TIME = 2; // Request files older than the specified time with parameter e.g., "20260719_103000"
}

// Defines the source/category of video files to query
enum VideoMode {
  RECORDING = 0; // Default: regular recordings
  TIMELAPSE = 1; // Timelapse recordings
}

message QueryFileRequest {
  QueryFileType type      = 1;
  string        parameter = 2;
  VideoMode     mode      = 3;
}

message TransferFileRequest {
  string filepath = 1; // The path of the file to transfer.
}

message ToggleTrackingRequest {
  bool enable = 1; // true = enable overlay, false = disable
}

// No arguments, but still a message each: the arm of Request.payload they set is what
// identifies them.
message StartRecordingRequest {}

message StopRecordingRequest {}

// ── Responses ───────────────────────────────────────────────────────────────

// Sent back to the client after a recording is started or stopped
message RecordingResponse {
  bool   is_recording = 1; // true = recording started, false = recording stopped
  string filepath     = 2; // current recording file path
}

message ToggleTrackingResponse {
  bool enabled = 1;
}

message FileEntry {
  string filepath     = 1;
  uint32 duration_sec = 2;
  string thumbnail    = 3; // base64 jpeg image for previewing
}

// Answers a QueryFileRequest. Always streamed as a Stream body, never inline: one
// FileEntry.thumbnail alone can exceed the chunk size.
message QueryFileResponse {
  repeated FileEntry files = 1;
  VideoMode          mode  = 2;
}

// ── Packet bodies ───────────────────────────────────────────────────────────

// A client asking the device to do something.
message Request {
  oneof payload {
    DisconnectRequest     disconnect      = 1;
    ControlCameraRequest  control_camera  = 2;
    TakeSnapshotRequest   take_snapshot   = 3;
    QueryFileRequest      query_file      = 4;
    TransferFileRequest   transfer_file   = 5;
    ToggleTrackingRequest toggle_tracking = 6;
    StartRecordingRequest start_recording = 7;
    StopRecordingRequest  stop_recording  = 8;
  }
}

// A device answer small enough to travel inline on the command channel.
message Response {
  oneof payload {
    RecordingResponse      recording       = 1;
    ToggleTrackingResponse toggle_tracking = 2;
  }
}

// A body too large for one datachannel message: a header, a run of chunks and a trailer
// sharing a stream_id, so streams may interleave on an unordered channel and Chunk.offset
// places each piece regardless of arrival order.
//
// Nothing here says what the body is: the enclosing request_id and the channel it arrived
// on already do. mime_type is a hint, not the discriminator.
message Stream {
  message Header {
    uint64 total_length = 1;
    string mime_type    = 2; // optional, e.g. "image/jpeg", "video/mp4"
  }

  message Chunk {
    uint64 offset = 1;
    bytes  data   = 2;
  }

  message Trailer {
    // Empty on a normal end. Non-empty means aborted: discard what was reassembled.
    string reason = 1;
  }

  // Shared by the header, every chunk and the trailer of one transfer: the key a
  // receiver assembles on.
  string stream_id = 1;

  oneof payload {
    Header  header  = 2;
    Chunk   chunk   = 3;
    Trailer trailer = 4;
  }
}

// Payload relayed to a named IPC endpoint.
// Endpoints are fixed at startup; unknown names are dropped.
// Multiple consumers may attach to an endpoint.
//
// Reserved:
//   ""         default socket (--enable-ipc), opaque bytes
//   "gamepad"  InputReport (--enable-gamepad)
//
// Register new endpoints here to avoid name conflicts.
message Ipc {
  string endpoint = 1;
  // Per-endpoint sequence. Lossy channels forward only newer messages.
  // Zero means unsequenced.
  uint64 sequence = 2;
  bytes payload = 3;
}

// The envelope for everything on every channel. `body` says what kind of thing this is;
// which particular one comes from that body's own oneof, so there is no separate type
// field to fall out of step with it.
message Packet {
  // Client-generated, echoed by the device on the matching response so concurrent
  // requests of the same kind can be told apart. Empty on anything sent unprompted.
  string request_id = 1;

  oneof body {
    Request  request  = 2;
    Response response = 3;
    Stream   stream   = 4;
    // An IPC payload: opaque application bytes. Only when it fits in one message; a
    // larger one goes as a Stream on the same channel.
    bytes raw = 5;
    Ipc ipc = 6;
  }
}
